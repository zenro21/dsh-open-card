<svg xmlns="http://www.w3.org/2000/svg" width="720" height="180" viewBox="0 0 720 180" role="img" aria-label="dsh-open-card">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0e1116"/>
      <stop offset="55%" stop-color="#151b24"/>
      <stop offset="100%" stop-color="#12233a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2b6cf6"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.18" cy="0.45" r="0.55">
      <stop offset="0%" stop-color="#2b6cf6" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#2b6cf6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="720" height="180" fill="url(#bg)"/>
  <rect width="720" height="180" fill="url(#glow)"/>

  <!-- 可拖拽边框的示意：虚线框 + 八个控制点 -->
  <rect x="54" y="42" width="96" height="72" rx="10"
        fill="#2b6cf6" fill-opacity="0.10"
        stroke="#2b6cf6" stroke-opacity="0.85" stroke-width="1.6"/>
  <rect x="66" y="54" width="72" height="48" rx="6"
        fill="none" stroke="#5b8ff9" stroke-opacity="0.45"
        stroke-width="1.2" stroke-dasharray="4 4"/>

  <g fill="#8fb4ff">
    <rect x="50" y="38" width="8" height="8" rx="2"/>
    <rect x="146" y="38" width="8" height="8" rx="2"/>
    <rect x="50" y="110" width="8" height="8" rx="2"/>
    <rect x="146" y="110" width="8" height="8" rx="2"/>
    <rect x="98" y="38" width="8" height="8" rx="2"/>
    <rect x="98" y="110" width="8" height="8" rx="2"/>
    <rect x="50" y="74" width="8" height="8" rx="2"/>
    <rect x="146" y="74" width="8" height="8" rx="2"/>
  </g>

  <!-- 右下的缩放把手，暗示「拉边框」 -->
  <g stroke="#a78bfa" stroke-width="2" stroke-linecap="round" fill="none">
    <path d="M136 110 L152 94"/>
    <path d="M144 112 L156 100"/>
  </g>

  <text x="196" y="86" font-family="'Segoe UI', system-ui, -apple-system, sans-serif"
        font-size="34" font-weight="700" fill="#ffffff">dsh-open-card</text>
  <text x="196" y="118" font-family="'Segoe UI', system-ui, -apple-system, sans-serif"
        font-size="16" fill="#9fb3d8">可拖拽边框 · 面板尺寸调节</text>
  <text x="196" y="146" font-family="'Segoe UI', system-ui, -apple-system, sans-serif"
        font-size="12.5" fill="#64748b">DeepSeek Harness Web UI · 零依赖 · MIT</text>

  <rect x="0" y="176" width="720" height="4" fill="url(#accent)"/>
</svg>
